name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @851-labs/tokenmaxxing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"

      - name: Setup npm
        run: npm install --global npm@12.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.GITHUB_REF_NAME;
          const packageJson = JSON.parse(readFileSync("apps/cli/package.json", "utf8"));
          const expectedTag = `cli-v${packageJson.version}`;

          if (tag !== expectedTag) {
            console.error(`Tag ${tag} does not match CLI package version ${packageJson.version}.`);
            console.error(`Expected ${expectedTag}.`);
            process.exit(1);
          }
          NODE

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Test CLI and bundled API contract
        run: bun run vp test --project cli --project api-contract

      - name: Publish CLI and native packages
        run: bun apps/cli/script/publish.ts
