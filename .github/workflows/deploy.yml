name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, never cancelled mid-apply — alchemy state writes
# must not race.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Deploy
        run: bunx alchemy deploy --stage prod --yes
        env:
          ALCHEMY_STATE: cloudflare
          CLOUDFLARE_ACCOUNT_ID: 630f294bcb2c1e9b751d9fe0655a453a
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # GitHub blocks GITHUB_-prefixed secret names; map them here.
          GITHUB_CLIENT_ID: ${{ secrets.TMX_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.TMX_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.TMX_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.TMX_GOOGLE_CLIENT_SECRET }}
