name: CI

on:
  pull_request:
  # Pushes to main run these checks via deploy.yml, which gates the deploy on
  # them; a separate push trigger here would just run them twice.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; a main run gates a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Check, test, and migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Test
        run: bun run test

      # Deploys apply packages/db/migrations to D1, so the drizzle schema must
      # never get ahead of the committed migrations. `git status` (not
      # `git diff`) so newly generated, untracked migration files count too.
      - name: Check schema and migrations are in sync
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            git status --short -- packages/db/migrations
            echo "::error::packages/db schema has changes without a migration. Run 'bun run db:generate' and commit the result."
            exit 1
          fi
